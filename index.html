<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studiu individual 2</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      margin: 20px 0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    footer {
      padding: 15px;
      background: #1e1e1e;
      font-size: 14px;
    }
  </style>
</head>
<body>
    <h1>📸 Albumul meu Foto</h1>
  <p>Generator simplu de albume foto</p>

  <div class="gallery">
    <img src="images/1.jpeg" alt="Poză 1">
    <img src="images/2.jpg" alt="Poză 2">
    <img src="images/3.jpg" alt="Poză 3">
    <img src="images/4.jpg" alt="Poză 4">
    <img src="images/5.jpg" alt="Poză 5">
    <img src="images/6.jpg" alt="Poză 6">
  </div>

  <footer>
    Proiect realizat folosind GitHub — Generator Albume Foto
  </footer>
</body>
</html>
